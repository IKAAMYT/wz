name: Build Warzone Offsets
 
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
 
jobs:
  build:
    runs-on: windows-latest
 
    steps:
    - uses: actions/checkout@v4
 
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
 
    - name: Build Release x64
      run: |
        if exist "*.sln" (
          msbuild *.sln /p:Configuration=Release /p:Platform=x64 /m
        ) else if exist "*.vcxproj" (
          msbuild *.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        )
 
    - name: Find and upload executable
      uses: actions/upload-artifact@v4
      with:
        name: warzone-offsets-x64
        path: |
          **/Release/**/*.exe
          **/x64/Release/**/*.exe
      continue-on-error: true
 
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
 
