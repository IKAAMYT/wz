name: Build Warzone Offsets
 
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
 
jobs:
  build:
    runs-on: windows-latest
 
    steps:
    - uses: actions/checkout@v4
 
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
 
    - name: Setup Visual Studio Build Tools Environment
      shell: cmd
      run: |
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
 
    - name: Build Release x64
      shell: cmd
      run: |
        for /r . %%f in (*.sln) do (
          echo [+] Found solution: %%f
          msbuild "%%f" /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.20348.0
          if not errorlevel 1 exit /b 0
        )
        for /r . %%f in (*.vcxproj) do (
          echo [+] Found project: %%f
          msbuild "%%f" /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.20348.0
          if not errorlevel 1 exit /b 0
        )
        echo [-] No buildable project found
        exit /b 1
 
    - name: List all files
      shell: cmd
      run: dir /s /b *.exe *.dll *.lib || echo No binaries found
      continue-on-error: true
 
    - name: Find and upload executable
      uses: actions/upload-artifact@v4
      with:
        name: warzone-build
        path: .
      continue-on-error: true
 
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
